# Builds the static app and publishes it to GitHub Pages on every push to main.
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Security check before every publication (SEC-17).
      - run: npm audit --omit=dev --audit-level=high

      # All tests must pass before anything is published.
      - run: npm test

      # Model files are not in the repository; download them once and reuse.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('config/models.json', 'scripts/fetch-models.mjs') }}

      - run: npm run models

      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
